# =============================================================================
# GeoOceanModel - Default Demonstration Configuration
# =============================================================================
# Baseline configuration for 3D regional ocean hydrodynamics, tidal forcing,
# and surface boundary interactions.
#
#   julia --project=. GeoOceanModelRun.jl --config=configs/default.toml --all
# =============================================================================

[domain]
# Geographic bounding box in degrees (WGS84, EPSG:4326)
lon_min = -61.2               # Western boundary longitude (°E)
lon_max = -59.6               # Eastern boundary longitude (°E)
lat_min = 45.0                # Southern boundary latitude (°N)
lat_max = 46.9                # Northern boundary latitude (°N)
z_min = -1500.0               # Maximum bathymetric water depth (m, negative down)
z_max = 0.0                   # Free surface elevation (m)
buffer_km = 20.0              # Boundary buffer margin in kilometres

[grid]
# Discretization resolution and coordinate stretching
nx = 32                       # Zonal grid cell count
ny = 38                       # Meridional grid cell count
nz = 8                        # Vertical layer count
vertical_stretching_mode = "tanh" # "tanh", "oceananigans", or "uniform"
nz_above = 0                  # Layers allocated to upper stratum (0 = auto 60%)
vertical_break_depth = 400.0  # Depth separating refined shelf from deep basin (m, positive)
vertical_grid_file = ""       # Optional side-car CSV specifying vertical faces
# Explicit vertical layer face depths starting at 0.0 (surface) to domain bottom
depths = [0.0, 20.0, 50.0, 100.0, 150.0, 300.0, 600.0, 1000.0, 1500.0]

[bathymetry]
# Analytical and geometric shelf controls
inshore_depth = 20.0          # Water depth at landward edge (m, positive downward)
shelf_slope = 180.0           # Total seabed rise / relief across continental shelf (m)
mask_bay_of_fundy = false     # Damp resonance in the Bay of Fundy if in domain

[data]
# Environmental data sources and assimilation settings
bathy_source = "etopo2022"    # Bathymetry provider: "etopo2022", "nwa_bathymetry"
coastline_source = "natural_earth_10m" # Coastline provider: "natural_earth_10m"
wind_source = "open_meteo"    # Surface winds provider: "open_meteo" (ERA5), "cds"
wind_time_iso = "2020-06-01T00:00:00Z" # Reference timestamp for wind forcing
hydrography_source = "woa23"  # Climatology: "woa23" (NOAA), "glorys12v1", "synthetic"
hydrography_month = 0         # Month index (0 = annual climatological mean, 1..12)

[atmosphere]
# Atmospheric forcing and heat exchange
source = "era5_climatology"   # "open_meteo", "era5_climatology", or "synthetic"
bulk_heat_flux = true         # Compute bulk sensible/latent flux from air state

[boundaries]
# Lateral open boundary conditions and sponge relaxation
method = "none"               # "none" (unconstrained) or "relaxation" (sponge)
obc_type = "flather_chapman"  # "flather_chapman", "radiation", or "clamped"
ocean_boundary_source = "synthetic" # "glorys12v1", "woa23", "hycom", or "synthetic"
sponge_layer_width = 0.25     # Width of lateral sponge zone in degrees
sponge_timescale_seconds = 3600.0 # Relaxation timescale in seconds (1 hour)
u_inflow = -0.15              # Prescribed background zonal inflow velocity (m/s)
v_inflow = 0.05               # Prescribed background meridional inflow velocity (m/s)

[tides]
# Astronomical tidal body and boundary forcing
enable_tides = false          # Whether to enable astronomical tidal dynamics
tides_source = "analytic"     # "tpxo9_atlas", "tpxo9", or "analytic"
tidal_constituents = []       # Active constituents (e.g. ["M2", "S2"])
tidal_u_amp = 0.25            # M2 zonal velocity amplitude (m/s)
tidal_v_amp = 0.12            # M2 meridional velocity amplitude (m/s)
s2_u_amp = 0.11               # S2 zonal velocity amplitude (m/s)
s2_v_amp = 0.05               # S2 meridional velocity amplitude (m/s)

[climate]
# Long-term climate scenario projections
scenario = "climatology"      # "climatology", "historical", "ssp126", "ssp245", "ssp585"
projection_year = 2022        # Target simulation climate year

[hydrodynamics]
# Numerical solver controls and time-stepping
sim_duration_hours = 72.0     # Total simulation duration in hours
sim_dt_seconds = 120.0        # Initial numerical time step in seconds
min_dt_seconds = 5.0          # Minimum allowable time step floor (seconds)
max_dt_seconds = 900.0        # Maximum allowable time step ceiling (seconds)
adaptive_cfl = true           # Enable adaptive time stepping based on CFL
target_cfl = 0.2              # Target Courant-Friedrichs-Lewy condition limit
target_wave_cfl = 0.20        # Target wave CFL limit for barotropic gravity waves
surface_heat_flux = 50.0      # Prescribed surface heat flux (W/m^2)
max_current_speed = 3.0       # Current speed ceiling in m/s (negative disables clamp)
max_flow_snapshots = 400      # Snapshot memory retention limit (0 = all)
spinup_hours = 0.0            # Spinup duration before saving outputs (hours)
allow_analytical_fallback = false # Fall back to synthetic jet if inputs unavailable
hydro_model_file = ""         # Hydrodynamic checkpoint file (input or output)
reuse_hydro = false           # Reuse existing flow fields if found on disk


[storage]
# Output lakehouse persistence and state serialization
output_dir = "../lakehouse/GeoOceanModel/default" # Target Lakehouse output directory
output_schedule_seconds = 21600.0 # Field-output interval (seconds, 6 hours)
enable_zarr = true            # Persist 4D ocean state to chunked Zarr store
zarr_path = "outputs/ocean_hydrodynamics.zarr" # Relative or absolute Zarr path
storage_backend = "zarr"      # Persistence format ("zarr" or "geoparquet")
enable_checkpoint = true      # Save Oceananigans simulation checkpointer state
checkpoint_dir = "../lakehouse/GeoOceanModel/default/checkpoints" # Checkpoint folder
checkpoint_prefix = "default_checkpoint" # Filename prefix for checkpoint files
checkpoint_schedule_seconds = 21600.0 # State checkpoint frequency in seconds
checkpoint_cleanup = true     # Automatically purge older intermediate checkpoints
run_id = ""                   # Unique run identifier tag

[visualization]
# Diagnostics, animations, and interactive mapping
interactive_map = true        # Export interactive HTML5 Leaflet map
animate_hydro = false         # Generate hydrodynamic simulation animation
anim_variable = "dashboard"   # Variable: "dashboard", "speed", "temperature", "eta"
anim_fps = 10                 # Animation frames per second
anim_format = "mp4"           # Video container format: "mp4", "gif", or "webm"
anim_depth = -2.5             # Depth slice for 2D flow animation (m)
anim_overlay_particles = false# Render particle positions on top of flow field
anim_output_path = ""         # Custom destination path for animation video

[runtype]
# Execution hardware and reproducibility
use_gpu = true                # Enable NVIDIA CUDA GPU acceleration
fallback_to_cpu = false       # Reject silent degradation to CPU if GPU requested
seed = 42                     # Master RNG seed
