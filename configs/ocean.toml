# ==============================================================================
#  GeoOceanModel — the ocean half of a run's configuration
# ==============================================================================
#
#  Split from ParticleTracking.toml during phase 4 of the ParticleTracking split
#  (SPLIT_PLAN.md). The partition itself lives in one place, as the mapping
#  `ParticleTracking.CONFIG_SECTION_DOMAIN`; this file and its sibling are what that
#  mapping produces, regenerated by `scratch/split_config.jl`.
#
#  Sections in this half: atmosphere, bathymetry, bottom_boundary_layer, boundaries, climate, data, domain, grid, hardware, hydrodynamics, metadata, paths, storage, tides, visualization
#
#  The other half is in ../GeoLarvalTracking/ParticleTracking.toml.
#
#  A section this half does not own belongs to the other one. Nothing in a half is a
#  second copy of the other: the ocean half declares the domain and the grid the
#  biology half works inside, and after phase 6 the biology half reads the ocean's
#  parameters from the hydrodynamic output file's metadata rather than from any TOML.
# ==============================================================================

[atmosphere]
# Analytical wind stress (Large & Pond 1981) rather than ERA5, so the run is offline.
forcing = "era5_climatology"
climatology = true
variables = ["u10", "v10"]
drag_formulation = "garratt_1977"   # Cd = (0.75 + 0.067*U10)*1e-3
bulk_heat_flux = true


[bathymetry]
# The dataset is named once, as `bathy_source` in [data] ("synthetic" here). No fallback
# dataset is offered.
ingest_library = "numerical_earth"
resolution_arcsec = 60       # Coarser "resolution" to match the coarse grid
inshore_depth = -20.0
shelf_slope = 500.0


[bottom_boundary_layer]
cd_drag = 0.0025                # Quadratic bottom drag coefficient
bottom_drag = 0.0001            # Background linear friction (1/s)
bbl_mixing_closure = "tke"      # Vertical mixing closure family


[boundaries]
# Switched off here, along with the tides below, because this file is the fast baseline the
# test suite runs against: sponge and tides off is what makes a run cheap enough to repeat.
# The edges being unconstrained is a real consequence, not a placeholder -- any result that
# depends on water crossing an open edge is not a result this config can support.
# configs/snowcrab.toml is the one set up for real analysis, with the sponge on.
#
# What each accepted value gives you is documented once, in src/config/configuration.jl.
# This file only records the choice.
method = "none"
parent_ocean = "synthetic"
ocean_boundary_source = "synthetic"    # no download; open edges unconstrained
climatology = true              # Let the outside conditions repeat instead of running out
obc_type = "flather_chapman"    # Standard treatment for the sea surface height and overall flow
active_boundaries = ["east", "south", "west"]   # Which edges are open
sponge_layer_width = 0.25          # Width of the eased band, in degrees
sponge_timescale_seconds = 3600.0  # How long that band takes to be pulled back, in seconds
u_inflow = -0.15                   # Speed of water coming in along the shelf, m/s
v_inflow = 0.05                    # Speed of that water across the shelf, m/s

# The surrounding region the outside conditions are cut from. Larger than the study area,
# because the model needs to know what the water is doing just beyond the study area's edges.
embedding_lon_min = -71.0         # Western edge of the surrounding region
embedding_lon_max = -53.0         # Eastern edge
embedding_lat_min = 40.0          # Southern edge
embedding_lat_max = 48.5          # Northern edge


[climate]
# Baseline (no perturbation). Switch to ssp126 / ssp245 / ssp585 / mhw to apply a
# scenario anomaly via climate_scenarios.jl.
scenario = "climatology"
projection_year = 2022   # Target year for CMIP6-style scenarios.
baseline_year = 2020     # Reference year for anomaly calculation.
horizon_year = 2050      # Benchmark projection horizon for the delta scaling.


[data]
# The product to ingest is named directly; there is no real/synthetic mode switch
# and no fallback product. "synthetic" here keeps the run fully offline: an
# analytical shelf bathymetry is generated and wind stress comes from a closed-form
# drag law. Set bathy_source = "etopo2022" (and a real wind_source) to pull observed
# products through NumericalEarth.jl instead.
coastline_source = "natural_earth_10m"  # Outline of the land at full detail, public domain
bathy_source = "etopo2022"      # Sea floor map from NOAA, about 450 m detail, free
wind_source = "open_meteo"      # Real past weather, via a free website
hydrography_source = "woa23"    # Monthly average temperature and salt for the whole ocean, NOAA, free
wind_time_iso = "2020-06-01T00:00:00Z"  # Which moment to take the weather from


[domain]
# Study domain: the computational grid and analysis region.
lon_min = -68.0
lon_max = -57.0
lat_min = 42.0
lat_max = 47.5
z_min = -3000.0
z_max = 0.0
buffer_km = 50.0        # Spatial buffer for particle seeding (km)

# The embedding domain is declared once, in [boundaries]. It is not repeated here.


[grid]
# Coarse grid: ~11 km cells, so a full run is cheap. Raise nx/ny for real work.
nx = 60
ny = 45
nz = 10
depths = [0.0, 10.0, 20.0, 40.0, 60.0, 100.0, 200.0, 400.0, 700.0, 1500.0, 3000.0]
resolution_scale = 1.0
# "tanh" refines resolution toward the surface and seabed; "uniform" is plain layers.
vertical_stretching_mode = "tanh"


[hardware]
# CPU by default: this is a coarse verification grid, and the run is dominated by
# compilation rather than compute. Set use_gpu = true to exercise the CUDA path.
use_gpu = false
fallback_to_cpu = false             # A GPU request aborts rather than degrading silently


[hydrodynamics]
# Short integration: enough to spin up the circulation, not enough to be a
# climatology. Increase sim_duration_hours for production.
sim_duration_hours = 12.0
sim_dt_seconds = 120.0
adaptive_cfl = true
target_cfl = 0.2
target_wave_cfl = 0.2
max_dt_seconds = 600.0
min_dt_seconds = 2.0
coriolis_latitude = 44.5        # Informational; ocean_simulation uses a spherical Coriolis
divergence_velocity_limit = 20.0
surface_heat_flux = 50.0        # Net surface heat flux (W/m²)
turbulence_closure = "nemotke"  # NEMO-TKE vertical mixing
enable_sea_ice = false          # Freezing diagnostics off for the fast run
enable_oxygen = false           # No biogeochemistry in the baseline
output_schedule_seconds = 3600.0
hydro_model_file = "hydrodynamics_default.jld2"
enable_checkpoint = true


[metadata]
name = "ParticleTracking Baseline Run"
description = "Generic low-resolution demonstration of the regional circulation and Lagrangian particle-tracking pipeline, using synthetic bathymetry and analytical wind stress"
author = "ParticleTracking contributors"
version = "1.0.0"


[paths]
# `output_dir` lives in [storage] with the rest of the output settings. `input_dir`
# is the fixed shared cache for ingested data and is not configurable.
seed = 42


[storage]
# All output for this configuration lands under outputs/default/, and the resolved
# configuration is copied there as `resolved_config.toml` for provenance.
output_path = "outputs/default/default.jld2"
storage_backend = "zarr"
output_schedule_seconds = 3600.0
checkpoint_fields = ["u", "v", "w", "T", "S"]
enable_checkpoint = true
checkpoint_prefix = "default_checkpoint"
checkpoint_schedule_seconds = 3600.0
checkpoint_dir = "outputs/default/checkpoints"
cleanup_checkpoints = true
auto_restart = true


[tides]
# Tides are switched off for this baseline, for the same unfinished reason as the open edges
# above. See configs/snowcrab.toml for a working version.
tides_source = "analytic"     # Tides made up from the numbers below; nothing downloaded
constituents = []             # Which tides to include; empty because tides are off
enable_tides = false          # Leave this off unless you specifically want tides
tidal_u_amp = 0.25      # How strongly the M2 tide pushes water along the shelf, m/s
tidal_v_amp = 0.12      # How strongly it pushes across the shelf, m/s
s2_u_amp = 0.11         # The same for the S2 tide, along the shelf
s2_v_amp = 0.05         # The same for the S2 tide, across the shelf
tidal_period = 44712.0  # How long one M2 cycle lasts, in seconds (about 12.4 hours)
tidal_phase = 0.0       # Where in its cycle the model starts


[visualization]
interactive_map = true
title = "ParticleTracking Baseline Run"


